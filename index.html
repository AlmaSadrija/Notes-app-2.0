<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Notes App 2.0</title>
  </head>

  <body>
    <div class="container">
      <h1>📝My Notes</h1>
      <p class="simple-text">Your personal note-taking space</p>
      <div class="controls">
        <button id="create-note-btn" class="btn-primary">
          ➕Create New Note
        </button>
        <button id="delete-notes-btn" class="btn-secondary">🗑️Clear All</button>
      </div>
      <div id="notes-section" class="notes-grid"></div>
      <p>✨ No notes yet. Click "Create New Note" to get started!</p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
